name: Apply release 2026.08.06.1

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'release/2026.08.06.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply release payload
        shell: bash
        run: |
          if [ ! -d .release ]; then
            echo "Release payload already applied."
            exit 0
          fi
          sha256sum .release/part-*
          cat .release/part-* > /tmp/rubies-release.b64
          sha256sum /tmp/rubies-release.b64
          base64 --decode /tmp/rubies-release.b64 > /tmp/rubies-release.tar.gz
          sha256sum /tmp/rubies-release.tar.gz
          tar -xzf /tmp/rubies-release.tar.gz -C .
          rm -rf .release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply release 2026.08.06.1"
          git push origin HEAD:${{ github.head_ref }}
