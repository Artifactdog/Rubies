name: Apply release 2026.08.06.0

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'release/2026.08.06.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/2026.08.06.0
          fetch-depth: 0
      - name: Expand release files
        shell: bash
        run: |
          cat .release/ui.tgz.b64.* | base64 --decode > /tmp/rubies-ui.tgz
          tar -xzf /tmp/rubies-ui.tgz
      - name: Commit release files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/styles.css README.md SECURITY.md docs/architecture.md
          git diff --cached --quiet && exit 0
          git commit -m 'Complete recurring target interface for 2026.08.06.0'
          git push origin HEAD:release/2026.08.06.0
