name: Apply Rubies v0.2

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-v0.2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand verified source bundle
        shell: bash
        run: |
          cat .bootstrap/rubies.zip.b64.* | base64 --decode > /tmp/rubies-v0.2.0.zip
          unzip -oq /tmp/rubies-v0.2.0.zip -d .
          rm -rf .bootstrap .github/workflows/bootstrap-v0.2.yml
      - name: Commit v0.2 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build interactive protected budget v0.2.0' || exit 0
          git push
