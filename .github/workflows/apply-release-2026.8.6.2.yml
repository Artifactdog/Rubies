name: Apply release 2026.8.6.2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'release/2026.8.6.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply source payload
        shell: bash
        run: |
          cat .release-r2/part-* > /tmp/rubies-release.b64
          echo 'b4a70870b87ed6a7f1863867f7329923c107b394eac4a8d24856a61df2fa842a  /tmp/rubies-release.b64' | sha256sum -c -
          base64 --decode /tmp/rubies-release.b64 > /tmp/rubies-release.tar.gz
          echo '0b90a4bbd72ae67f275c9fae02d99419e73a84571d9f380091e991fcb1d8c6ae  /tmp/rubies-release.tar.gz' | sha256sum -c -
          tar -xzf /tmp/rubies-release.tar.gz -C .
          rm -rf .release-r2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply release 2026.8.6.2 source'
          git push origin HEAD:${{ github.head_ref }}
