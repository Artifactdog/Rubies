name: Apply whole-unit slider fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/slider-whole-unit-2026.8.17.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch money slider and release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          marker = '  const maxWholeUnits = Math.max(1, Math.round(safeMax / 100))'
          if marker not in text:
              start = text.index('  const safeMax = Math.max(1, Math.round(max))')
              end = text.index('\n\n  return (', start)
              calculation = (
                  '  const safeMax = Math.max(100, Math.ceil(max / 100) * 100)\n'
                  '  const maxWholeUnits = Math.max(1, Math.round(safeMax / 100))\n'
                  '  const wholeUnitValue = Math.max(0, Math.min(maxWholeUnits, Math.round(value / 100)))\n'
                  '  const fill = `${(wholeUnitValue / maxWholeUnits) * 100}%`'
              )
              text = text[:start] + calculation + text[end:]

          if 'max={maxWholeUnits}' not in text:
              start = text.index('        max="1000"')
              end = text.index('\n        style=', start)
              slider_input = (
                  '        max={maxWholeUnits}\n'
                  '        step="1"\n'
                  '        value={wholeUnitValue}\n'
                  '        onChange={(event) => onChange(Number(event.target.value) * 100)}'
              )
              text = text[:start] + slider_input + text[end:]

          app.write_text(text)

          package = Path('package.json')
          package.write_text(package.read_text().replace('"version": "2026.8.17.4"', '"version": "2026.8.17.5"'))

          version = Path('src/version.ts')
          version.write_text(version.read_text().replace('2026.8.17.4', '2026.8.17.5'))

          sw = Path('public/sw.js')
          sw.write_text(sw.read_text().replace('rubies-shell-2026.8.17.4', 'rubies-shell-2026.8.17.5'))

          test = Path('tests/money-slider.test.mjs')
          test.write_text("""import test from 'node:test'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'

          const app = readFileSync(new URL('../src/App.tsx', import.meta.url), 'utf8')

          test('money sliders advance in exact whole currency units', () => {
            assert.match(app, /const maxWholeUnits = Math\.max\(1, Math\.round\(safeMax \/ 100\)\)/)
            assert.match(app, /max=\{maxWholeUnits\}[\s\S]*step="1"[\s\S]*value=\{wholeUnitValue\}/)
            assert.match(app, /onChange=\{\(event\) => onChange\(Number\(event\.target\.value\) \* 100\)\}/)
            assert.doesNotMatch(app, /const moneyStep =/)
            assert.doesNotMatch(app, /max="1000"/)
          })
          """)
          PY
      - name: Commit generated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Slider fix already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx package.json src/version.ts public/sw.js tests/money-slider.test.mjs
          git commit -m 'Make money sliders use whole-unit steps'
          git push origin HEAD:${{ github.head_ref }}
